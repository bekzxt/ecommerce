global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'order-service'
    static_configs:
      - targets: ['order-service:2112']

  - job_name: 'inventory-service'
    static_configs:
      - targets: ['inventory-service:2113']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq-exporter:9419']

  - job_name: "node"
    static_configs:
      - targets: [ "node-exporter:9100" ]